name: QuietoNative
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Superwall:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.17.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.3
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: NR772G2FPF
    CODE_SIGN_STYLE: Automatic
targets:
  QuietoNative:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        SUPERWALL_API_KEY: REPLACE_WITH_SUPERWALL_PUBLIC_KEY
        SUPABASE_URL: REPLACE_WITH_SUPABASE_URL
        SUPABASE_PUBLISHABLE_KEY: REPLACE_WITH_SUPABASE_PUBLISHABLE_KEY
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietoapp.app.native
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: QuietoNative.entitlements
    dependencies:
      - package: Superwall
        product: SuperwallKit
      - package: Supabase
        product: Supabase
    scheme:
      gatherCoverageData: true
      testTargets:
        - QuietoNativeTests
  QuietoNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: QuietoNative
