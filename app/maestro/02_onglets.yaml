# Test : navigation entre les 3 onglets (app déjà lancée — stopApp: false
# pour ne pas la redémarrer et garder la session flutter run et ses logs vivante).
# Prérequis : être connecté (ou « sans compte ») et sur l'écran d'accueil.
# ⚠️ Le premier tap après launchApp peut être avalé (warm-up du driver) :
# on tape d'abord sur « Accueil » (sans effet, on y est déjà) pour l'absorber,
# et chaque navigation est vérifiée par un assertVisible — jamais de capture aveugle.
appId: com.quietoapp.app
---
- launchApp:
    stopApp: false
- tapOn: "Accueil"
- tapOn: "Profil"
- extendedWaitUntil:
    visible: "Mon compte"
    timeout: 5000
- takeScreenshot: rapports-qa/captures/maestro-02-profil
- tapOn: "Louane"
- waitForAnimationToEnd:
    timeout: 5000
# Écran d'intro de Louane (ne s'affiche qu'à la première visite) : on le ferme s'il est là
- runFlow:
    when:
      visible: "J'ai compris"
    commands:
      - tapOn: "J'ai compris"
      - waitForAnimationToEnd:
          timeout: 5000
- assertNotVisible: "Priorité du moment"
- takeScreenshot: rapports-qa/captures/maestro-02-louane
- tapOn: "Accueil"
- extendedWaitUntil:
    visible: "Priorité du moment"
    timeout: 5000
- takeScreenshot: rapports-qa/captures/maestro-02-accueil
