project_id = "quieto-local"

[auth]
enabled = true
enable_anonymous_sign_ins = true

# Zero-downtime bridge. Configure the same integration in the hosted
# dashboard before enabling dual-write in production.
[auth.third_party.firebase]
enabled = true
project_id = "quieto-06"

[functions.revenuecat-webhook]
verify_jwt = false


# Svix-signed webhook (SUPERWALL_WEBHOOK_SECRET); no Supabase JWT.
[functions.superwall-webhook]
verify_jwt = false

# Quieto Entreprise (B2B), called by the public site (no Supabase JWT) or by
# Stripe (Stripe-Signature, STRIPE_WEBHOOK_SECRET). See functions/ENTREPRISE.md.
[functions.enterprise-demo]
verify_jwt = false

[functions.enterprise-checkout]
verify_jwt = false

[functions.enterprise-order]
verify_jwt = false

[functions.enterprise-invoice]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
