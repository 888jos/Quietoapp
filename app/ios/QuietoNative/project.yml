name: QuietoNative
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Superwall:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.17.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.3
  Amplitude:
    url: https://github.com/amplitude/Amplitude-Swift
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: S7988JL5XT
    CODE_SIGN_STYLE: Automatic
targets:
  QuietoNative:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Quieto lit tes minutes de pleine conscience et ton sommeil pour te les montrer dans ton profil. Ces données restent sur ton iPhone.
        NSHealthUpdateUsageDescription: Quieto enregistre tes séances en minutes de pleine conscience dans Apple Santé.
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        SUPERWALL_API_KEY: pk_7IWqvzXD45PMoNfZQsNXe
        SUPABASE_URL: REPLACE_WITH_SUPABASE_URL
        SUPABASE_PUBLISHABLE_KEY: REPLACE_WITH_SUPABASE_PUBLISHABLE_KEY
        AMPLITUDE_API_KEY: ff5aa0fa4c60fb4e05386c581fe97da7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quietoapp.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: QuietoNative.entitlements
    dependencies:
      - package: Superwall
        product: SuperwallKit
      - package: Supabase
        product: Supabase
      - package: Amplitude
        product: AmplitudeSwift
    scheme:
      gatherCoverageData: true
      testTargets:
        - QuietoNativeTests
  QuietoNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: QuietoNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
