name: quieto
description: "Quieto — application de méditation en français"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Subscriptions
  purchases_flutter: ^7.0.0

  # Local storage
  shared_preferences: ^2.2.0

  # Audio
  just_audio: ^0.9.36

  # Icons
  iconsax_flutter: ^1.0.0

  # URL Launcher
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/decouverte/
    - assets/audio/actualite/
    - assets/audio/stress/
    - assets/audio/sleep/
    - assets/audio/focus/
    - assets/audio/breathing/
    - assets/audio/anxiety/
    - assets/audio/confidence/
    - assets/audio/mindfulness/

