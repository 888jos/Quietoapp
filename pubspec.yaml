name: quieto
description: "Quieto — application de méditation en français"
publish_to: 'none'

version: 1.0.5+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Subscriptions
  purchases_flutter: ^9.14.0
  purchases_ui_flutter: ^9.0.0

  # Local storage
  shared_preferences: ^2.2.0

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.0

  # Icons
  iconsax_flutter: ^1.0.0

  # URL Launcher
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  cloud_functions: ^6.3.3
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  firebase_app_check: ^0.4.5
  firebase_core: ^4.11.0
  material_symbols_icons: ^4.2951.0

# Force path_provider sur une version SANS le package natif `objective_c`.
# La 2.6.0 (via objective_c / native-assets) ne s'embarque pas correctement sur
# les builds Xcode/release → crash dyld au lancement (« DOBJC_initializeApi »)
# = écran blanc. La 2.4.1 utilise l'implémentation Objective-C classique, stable.
dependency_overrides:
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/images/Logo 1.jpeg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/sessions/decouverte/
    - assets/images/sessions/actualite/
    - assets/images/sessions/stress/
    - assets/images/sessions/sleep/
    - assets/images/sessions/breathing/
    - assets/images/sessions/emotion/
    - assets/images/sessions/express/
    # Audios hébergés sur Firebase Storage (cf. AppConstants.audioBaseUrl)
    # — plus embarqués dans le binaire pour réduire la taille de l'app.

  fonts:
    # Police du paywall (design Sereine). Fichier variable (toutes graisses).
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf

